# 應用這包：db_api（唯一連 DB）+ backend（主邏輯）+ frontend（nginx）。
# 前置：先啟動 DB 那包（會建立 external 網路 harness-net）：
#   docker compose -f db/docker-compose.yml up -d
# 再啟動應用：
#   docker compose up -d --build
services:
  db_api:
    container_name: harness-db_api
    build: ./db_api
    env_file: ./db_api/.env            # DB 連線字串
    networks: [harness-net]
    # 內部服務，不需對外開埠；要除錯可加 ports: ["9000:9000"]

  mcp_server:
    container_name: harness-mcp_server
    build: ./mcp_server
    env_file: ./mcp_server/.env         # RAG 位址等設定（tool-calling 從 backend 搬過來的）
    volumes:
      # KB search 的檢索紀錄（模型/後端帶進來的 filter 參數＋完整結果）寫在容器內
      # /app/log，掛出來才留得住——不掛的話 container 一重建就整包不見。
      # 一天一個 kb_search-YYYY-MM-DD.jsonl，見 mcp_server/app/module/kb_log.py。
      - ./mcp_server/log:/app/log
    depends_on: [db_api, skill_runner]
    # 三掛：harness-net 連 db_api/backend，skill-net 連 skill_runner（code 技能沙盒），
    # kiki-chat-openclaw-network 讓 kiki-chat-openclaw 那邊的兩個 openclaw 節點連得到
    # 這裡當 MCP tool server（見該 repo 的 docker-compose.yml，網路在那邊建立）。
    # skill_runner 本身只掛 skill-net，連不到 harness-net——這是刻意的隔離，不是疏漏。
    networks: [harness-net, skill-net, kiki-chat-openclaw-network]
    # 內部服務，只有 backend 會連；不需對外開埠，要除錯可加 ports: ["9200:9200"]
    extra_hosts:
      # deveip3 這台在這個環境的網路裡沒有 DNS 紀錄，KB_BACKEND=azure 要打
      # AskQuestionStream 得靠這裡手動指到內網 IP 才能解析。
      - "deveip3.avc.co:192.168.31.74"

  mcp_server_eip:
    container_name: harness-mcp_server_eip
    build: ./mcp_server_eip
    env_file: ./mcp_server_eip/.env    # DNN 位址、簽章 secret、身分信任開關
    # 刻意跟 mcp_server 分開成兩個 process：mcp_server 有 dynamic_skills
    # （使用者可自建 http/code 技能），DNN 寫入憑證跟它同一個 process 就等於
    # 憑證離「被使用者自建技能撈走」只有一步。詳見 mcp_server_eip/main.py。
    #
    # 只掛 harness-net、且不發布 port —— 這個 process 持有 DNN 寫入權，
    # 不可以是瀏覽器可達的。要讓 openclaw 直接當 MCP tool server 用的話，
    # 得再加 kiki-chat-openclaw-network（會擴大可達範圍，先不加）。
    networks: [harness-net]
    # 容器內綁 0.0.0.0（綁 127.0.0.1 其他 container 就連不進來），
    # 靠「不發布 port + 只在 harness-net」取代 loopback 隔離。
    # 注意：0.0.0.0 + TRUST_EMP_ID_HEADER=true 會被 config.validate() 擋掉，
    # 見 mcp_server_eip/.env 的說明。
    extra_hosts:
      # DNN_BASE_URL 指向的 deveip3 在這個環境沒有 DNS 紀錄，跟 mcp_server 一樣
      # 要手動指到內網 IP，不然這個 container 連 dnn.py 的任何端點都解析不到。
      - "deveip3.avc.co:192.168.31.225"

  skill_runner:
    container_name: harness-skill_runner
    build: ./skill_runner
    env_file: ./skill_runner/.env
    networks: [skill-net]              # 不掛 harness-net：連不到 db_api/backend/外部網路
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # 只有 mcp_server 會連，不需對外開埠；殘留風險見 skill_runner/app/runner.py 開頭說明

  backend:
    container_name: harness-backend
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - /home/larry/playgroung/harness_agent/tmp/attachments:/data/attachments
    depends_on: [db_api, mcp_server]
    # ports:
    #   - "8000:8000"
    networks: [harness-net]

  frontend:
    container_name: harness-frontend
    build: ./frontend                 # Vite 建置 → nginx serve dist
    depends_on: [backend]
    ports:
      - "80:80"                      # 瀏覽器開 http://localhost:8880
    networks: [harness-net]

networks:
  harness-net:
    external: true                     # 由 db 那包建立
    name: harness-net
  skill-net:
    internal: true                     # 沒有出網、也連不到 harness-net 上的任何服務——code 技能只能算東西，不能連網路
  kiki-chat-openclaw-network:
    external: true                     # 由 kiki-chat-openclaw 那包建立
    name: kiki-chat-openclaw-network
